<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf6f0" />
  <title>Nosso Casamento — Fotos</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="shell">
    <section id="hero" class="hero">
      <p class="eyebrow">Nosso casamento</p>
      <h1 id="couple" class="couple"></h1>
      <div class="ornament" aria-hidden="true"><span></span>&#10086;<span></span></div>
      <p id="date" class="date"></p>
      <p id="tagline" class="tagline"></p>
    </section>

    <section id="step-name" class="card" hidden>
      <form id="name-form">
        <label for="guest" class="label">Como você se chama?</label>
        <input id="guest" name="guest" autocomplete="name" maxlength="80" required placeholder="Seu nome" />
        <button class="btn primary" type="submit">Continuar</button>
      </form>
    </section>

    <section id="step-upload" class="card" hidden>
      <p class="hello">Olá, <strong id="guest-label"></strong> <button id="change-name" class="link" type="button">trocar</button></p>
      <label class="btn primary big" for="files">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l2-2h6l2 2h3v12H4z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        Escolher fotos e vídeos
      </label>
      <input id="files" type="file" accept="image/*,video/*" multiple hidden />
      <p class="hint">Pode enviar quantas quiser. Vídeos até 500&nbsp;MB.</p>

      <div id="summary" class="summary" hidden>
        <div class="bar"><div id="bar-fill"></div></div>
        <p id="summary-text"></p>
      </div>
      <ul id="queue" class="queue"></ul>
    </section>

    <footer class="foot">Feito por Samuel Cassaneli</footer>
  </main>
  <script type="module" src="/src/guest.ts"></script>
</body>
</html>
